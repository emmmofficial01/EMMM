backend:
  name: github
  repo: emmmofficial01/EMMM
  branch: main
  base_url: https://exquisite-cobbler-e86b3e.netlify.app
  auth_endpoint: /.netlify/functions/auth

media_folder: assets/uploads
public_folder: /assets/uploads

publish: true

collections:
  - name: content
    label: "Website Management"
    files:
      - name: site
        label: "EMMM Website Content"
        file: "site-content.json"
        fields:

          # ==================================
          # HOMEPAGE
          # ==================================

          - label: "🏠 Announcement Headline"
            name: announcement
            widget: string
            required: false

          - label: "🎟️ Announcement Ticket Link"
            name: announcementLink
            widget: string
            required: false

          # ==================================
          # EVENT COUNTDOWN
          # ==================================

          - label: "⏳ Countdown Event Name"
            name: countdownTitle
            widget: string
            required: false

          - label: "📅 Countdown Date and Time"
            name: countdownDate
            widget: datetime
            required: false

          # ==================================
          # MUSIC RELEASES
          # ==================================

          - label: "🎵 Music Releases"
            name: releases
            widget: list
            required: false
            fields:

              - label: "Song or Album Title"
                name: title
                widget: string

              - label: "Release Year"
                name: year
                widget: string
                required: false

              - label: "Cover Artwork"
                name: image
                widget: image
                required: false

              - label: "Spotify URL"
                name: spotify
                widget: string
                required: false

              - label: "Apple Music URL"
                name: apple
                widget: string
                required: false

              - label: "YouTube URL"
                name: youtube
                widget: string
                required: false

          # ==================================
          # UPCOMING EVENTS
          # ==================================

          - label: "🎤 Upcoming Events"
            name: events
            widget: list
            required: false
            fields:

              - label: "Event Title"
                name: title
                widget: string

              - label: "Event Date"
                name: date
                widget: string

              - label: "Venue"
                name: venue
                widget: string
                required: false

              - label: "Event Flyer"
                name: image
                widget: image
                required: false

              - label: "Ticket URL"
                name: url
                widget: string
                required: false

          # ==================================
          # EMMM'S CRIB EPISODES
          # ==================================

          - label: "🎙️ EMMM's Crib Episodes"
            name: episodes
            widget: list
            required: false
            fields:

              - label: "Episode Title"
                name: title
                widget: string

              - label: "Featured Artists"
                name: artists
                widget: text
                required: false

              - label: "Episode Flyer"
                name: image
                widget: image
                required: false

          # ==================================
          # PUBLISHED NEWS
          # ==================================

          - label: "📰 Published News"
            name: news
            widget: list
            required: false
            fields:

              - label: "Brand"
                name: brand
                widget: select
                options:
                  - "EMMM"
                  - "EMMMPIRE"
                  - "EMMM'S CRIB"

              - label: "News Headline"
                name: title
                widget: string

              - label: "Source URL"
                name: url
                widget: string
                required: false

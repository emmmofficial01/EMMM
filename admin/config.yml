backend:
  name: github
  repo: emmmofficial01/EMMM
  branch: main
  base_url: https://exquisite-cobbler-e86b3e.netlify.app
  auth_endpoint: /.netlify/functions/auth

media_folder: assets/uploads
public_folder: /assets/uploads

publish: true

collections:
  - name: content
    label: Website Management
    files:

      - name: site
        label: EMMM Website Content
        file: site-content.json
       fields:
        - label: "🏠 Announcement Headline"
          name: announcement
          widget: string

        - label: "🎟️ Announcement Ticket Link"
          name: announcementLink
          widget: string
          required: false

        - label: "⏳ Countdown Event Name"
          name: countdownTitle
          widget: string
          required: false

        - label: "📅 Countdown Date and Time"
          name: countdownDate
          widget: datetime
          required: false

        - label: "🎵 Music Releases"
          name: releases
          widget: list
          fields:
              - {label: Title, name: title, widget: string}
              - {label: Year, name: year, widget: string, required: false}
              - {label: Artwork, name: image, widget: image, required: false}
              - {label: Spotify URL, name: spotify, widget: string, required: false}
              - {label: Apple Music URL, name: apple, widget: string, required: false}
              - {label: YouTube URL, name: youtube, widget: string, required: false}

          - label: "🎤 Upcoming Events"
            name: events
            widget: list
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Date, name: date, widget: string}
              - {label: Venue, name: venue, widget: string, required: false}
              - {label: Flyer, name: image, widget: image, required: false}
              - {label: Ticket URL, name: url, widget: string, required: false}

          - label: "🎙️ EMMM'S CRIB Episodes"
            name: episodes
            widget: list
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Artists, name: artists, widget: text}
              - {label: Flyer, name: image, widget: image, required: false}

          - label: "📰 News & Press"
            name: news
            widget: list
            fields:
              - label: Brand
                name: brand
                widget: select
                options:
                  - EMMM
                  - EMMMPIRE
                  - "EMMM'S CRIB"
              - {label: Headline, name: title, widget: string}
              - {label: Source URL, name: url, widget: string, required: false}

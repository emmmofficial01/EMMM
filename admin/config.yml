backend:
  name: github
  repo: emmmofficial01/EMMM
  branch: main
  base_url: https://exquisite-cobbler-e86b3e.netlify.app
  auth_endpoint: /.netlify/functions/auth

media_folder: assets/uploads
public_folder: /assets/uploads

publish: true

collections:
  - name: content
    label: "Website Management"
    files:

      # ==========================================
      # MAIN WEBSITE CONTENT
      # ==========================================

      - name: site
        label: "🏠 EMMM Website Content"
        file: "site-content.json"
        fields:

          # HOMEPAGE ANNOUNCEMENTS

          - label: "📢 Announcement Headline"
            name: announcement
            widget: string
            required: false

          - label: "🎟️ Announcement Ticket Link"
            name: announcementLink
            widget: string
            required: false

          # EVENT COUNTDOWN

          - label: "⏳ Countdown Event Name"
            name: countdownTitle
            widget: string
            required: false

          - label: "📣 Announcement Description"
            name: announcementDescription
            widget: text
            required: false

          - label: "🏷️ Announcement Category"
            name: announcementCategory
            widget: string
            required: false

          - label: "🔘 Announcement Button Text"
            name: announcementButton
            widget: string
            required: false

          - label: "📍 Announcement Location"
            name: announcementLocation
            widget: string
            required: false

          - label: "📅 Countdown Date and Time"
            name: countdownDate
            widget: datetime
            required: false

          # MUSIC RELEASES

          - label: "🎵 Music Releases"
            name: releases
            widget: list
            required: false
            fields:
              - label: "Song or Album Title"
                name: title
                widget: string

              - label: "Release Type (Single / EP / Album)"
                name: type
                widget: string
                required: false

              - label: "Release Year"
                name: year
                widget: string
                required: false

              - label: "Cover Artwork"
                name: image
                widget: image
                required: false

              - label: "Spotify URL"
                name: spotify
                widget: string
                required: false

              - label: "Apple Music URL"
                name: apple
                widget: string
                required: false

              - label: "YouTube URL"
                name: youtube
                widget: string
                required: false

          # UPCOMING EVENTS

          - label: "🎤 Upcoming Events"
            name: events
            widget: list
            required: false
            fields:
              - label: "Event Title"
                name: title
                widget: string

              - label: "Event Date"
                name: date
                widget: string

              - label: "Venue"
                name: venue
                widget: string
                required: false

              - label: "Event Description"
                name: description
                widget: text
                required: false

              - label: "Event Flyer"
                name: image
                widget: image
                required: false

              - label: "Ticket URL"
                name: url
                widget: string
                required: false

          # EMMM'S CRIB EPISODES

          - label: "🎙️ EMMM's Crib Episodes"
            name: episodes
            widget: list
            required: false
            fields:
              - label: "Episode Title"
                name: title
                widget: string

              - label: "Episode Date / City"
                name: date
                widget: string
                required: false

              - label: "Featured Artists"
                name: artists
                widget: text
                required: false

              - label: "Episode Flyer"
                name: image
                widget: image
                required: false

          # PUBLISHED NEWS

          - label: "📰 Published News"
            name: news
            widget: list
            required: false
            fields:
              - label: "Brand"
                name: brand
                widget: select
                options:
                  - "EMMM"
                  - "EMMMPIRE"
                  - "EMMM'S CRIB"

              - label: "News Headline"
                name: title
                widget: string

              - label: "Source URL"
                name: url
                widget: string
                required: false

      # ==========================================
      # PHOTO MANAGEMENT DASHBOARD
      # ==========================================

      - name: photos
        label: "📸 Website Photos"
        file: "website-photos.json"
        fields:

          - label: "Website Photo Gallery"
            name: photos
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:

              - label: "Photo Name"
                name: title
                widget: string

              - label: "Upload or Replace Photo"
                name: image
                widget: image

              - label: "Website Section"
                name: section
                widget: select
                options:
                  - "Homepage"
                  - "About"
                  - "Performances"
                  - "EMMMPIRE"
                  - "EMMM's Crib"
                  - "Gallery"
                  - "Music"
                  - "EPK"
                  - "EMMMRE3ELZ"

              - label: "Exact Photo Placement (recommended)"
                name: placement
                widget: select
                required: false
                options:
                  - "Automatic / section default"
                  - "About — Main Portrait"
                  - "Music — Main Photo"
                  - "Shows — Performance Photo"
                  - "EMMMPIRE — Main Logo"
                  - "EMMMPIRE — Secondary Logo"
                  - "EMMMPIRE — 2024 Dancehall Flyer"
                  - "EMMMPIRE — Rooftop Flyer"
                  - "EMMMPIRE — Old School Flyer"
                  - "EMMMPIRE — November 14 Flyer"
                  - "EMMM's Crib — Main Logo"
                  - "EMMM's Crib — Main Photo"
                  - "EMMM's Crib — Episode 1 Flyer"
                  - "EMMM's Crib — Episode 2 Flyer"
                  - "EMMM's Crib — Episode 3 Flyer"
                  - "EPK — Press Portrait"
                  - "EMMMRE3ELZ — Main Photo"

              - label: "Horizontal Photo Position (%)"
                name: positionX
                widget: number
                default: 50
                value_type: int
                min: 0
                max: 100

              - label: "Vertical Photo Position (%)"
                name: positionY
                widget: number
                default: 50
                value_type: int
                min: 0
                max: 100

              - label: "Image Fit"
                name: fit
                widget: select
                required: false
                options:
                  - "Original"
                  - "Cover"
                  - "Contain"
                default: "Original"

              - label: "Photo Description"
                name: description
                widget: text
                required: false
